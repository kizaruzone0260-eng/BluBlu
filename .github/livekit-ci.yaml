# LiveKit server config for the CI e2e job ONLY (.github/workflows/ci.yml → e2e → services.livekit).
#
# Why this file exists: five specs need a real media server (zz-camera, zz2-moderation,
# zz4-layout, zz13-screen-stage, zz9-prod-shape's RTC half, zz16's board-as-main-window case) and
# they self-skip when nothing answers on ws://127.0.0.1:7880, so on CI those paths were never
# executed. This config starts the same server image the deployment uses, with:
#   * `keys` — the pair the e2e stack already signs tokens with (LIVEKIT_API_KEY/SECRET in
#     apps/e2e/scripts/e2e-stack.mjs; these are test-only values, not a secret);
#   * `use_external_ip: false` — everything is on one host, so the server must advertise its
#     local address instead of probing a public IP;
#   * a fixed UDP media range, published to the runner in the workflow's `ports:` list.
# No TURN, no webhook, no redis: none of them are needed for two participants on localhost.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50099
  use_external_ip: false
keys:
  e2ekey: e2esecrete2esecrete2esecrete2esecret
