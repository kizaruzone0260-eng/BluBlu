name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: klass
          POSTGRES_PASSWORD: klass
          POSTGRES_DB: klass
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U klass" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://klass:klass@localhost:5433/klass
    steps:
      - uses: actions/checkout@v4
        # полная история обязательна: этот job проверяет секреты по всем коммитам, а shallow-клон
        # (fetch-depth: 1 по умолчанию) дал бы «история прочитана — 0 находок» там, где
        # история не прочитана вовсе
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4          # packageManager pinned in root package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # web/api typecheck imports @klass/shared → its dist must exist first
      - run: pnpm --filter @klass/shared build
      - run: pnpm -r typecheck
      - run: pnpm -r build
      - run: pnpm --filter @klass/api test          # unit + integration (real Postgres 16)
      # Секреты: сначала positive control детектора (8 форм обязаны ловиться), потом сам скан.
      # Скрипт выходит с кодом 2, если не смог прочитать дерево или историю — «чисто» и
      # «не посмотрел» больше не печатают одно и то же.
      - run: node scripts/security-scan.mjs --selftest
      - run: node scripts/security-scan.mjs
      # Второй глаз: независимый сканер по всей истории. Это инструмент CI, не зависимость
      # проекта (gitleaks 8.30.1, лицензия MIT). Версия пиннится, сумма сверяется.
      # Почему шаг не может быть просто `gitleaks …`: на этой истории инструмент, не сумев
      # прочитать часть диффов, печатает «no leaks found» и выходит с 0 (замерено: 3 строки ERR,
      # 151 коммит из 162, exit 0). Значит «проверка не состоялась» отделяется от «чисто» здесь:
      # по наличию ERR в выводе — exit 2. Находка секрета — exit 1. Значения redact-ятся.
      - name: gitleaks — независимый скан истории
        env:
          GL_VERSION: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}"
          asset="gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          curl -sSfLo "$asset" "$base/$asset"
          curl -sSfLo checksums.txt "$base/gitleaks_${GL_VERSION}_checksums.txt"
          grep " ${asset}\$" checksums.txt > only.sha256
          sha256sum -c only.sha256
          tar -xzf "$asset" gitleaks
          ./gitleaks version
          rc=0; out=$(./gitleaks git --redact --no-banner --log-opts=--all . 2>&1) || rc=$?
          # gitleaks красит уровни ANSI-последовательностями: без их снятия поиск «ERR» не
          # срабатывает никогда (проверено локально: крашеная строка с ERR есть, grep молчит).
          plain=$(printf '%s\n' "$out" | sed -E 's/\x1b\[[0-9;]*m//g')
          printf '%s\n' "$plain"
          if printf '%s\n' "$plain" | grep -qE '(^| )ERR( |$)'; then
            echo "::error::gitleaks не прочитал часть истории — «чисто» в этом случае ничего не значит"
            exit 2
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::gitleaks: находки (выведены redact-ными, значения не печатаются)"
            exit 1
          fi
          scanned=$(printf '%s\n' "$plain" | grep -oE '[0-9]+ commits scanned' | grep -oE '^[0-9]+' || echo '?')
          echo "gitleaks: находок нет; прочитано ${scanned} коммитов, достижимо из refs — $(git rev-list --all --count)"
      - run: pnpm audit --prod --audit-level=high
        continue-on-error: true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build-test
    services:
      # The media server the RTC specs need, so they stop self-skipping. Eight of the 81 tests
      # skipped on every CI run before this (zz-camera, zz2-moderation, zz4-layout, four of
      # zz13-screen-stage, zz16's compact button). The config goes in through LIVEKIT_CONFIG —
      # the documented alternative to `--config` — because a job service has no `args` key
      # (measured: run 37968027051 failed as a workflow-file problem on exactly that).
      # If the container ever fails to start, the specs skip again with the URL in the message
      # instead of turning the run red; the skip count is what the report tracks.
      livekit:
        image: livekit/livekit-server:v1.13.9
        ports: ['7880:7880', '7881:7881', '50000-50019:50000-50019/udp']
        env:
          # test-only key pair, matching apps/e2e/scripts/e2e-stack.mjs — not a secret
          LIVEKIT_CONFIG: |
            port: 7880
            rtc:
              tcp_port: 7881
              port_range_start: 50000
              port_range_end: 50019
              use_external_ip: false
            keys:
              e2ekey: e2esecrete2esecrete2esecrete2esecret
    env:
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_WS_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: e2ekey
      LIVEKIT_API_SECRET: e2esecrete2esecrete2esecrete2esecret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm --filter @klass/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @klass/e2e test
      # RTC-спеки умеют пропускать себя сами, когда медиа-сервер недоступен. Без этого гейта job с
      # мёртвым LiveKit-контейнером был бы зелёным — поэтому пропущенный тест = упавший CI.
      - run: node scripts/ci-no-skips.mjs apps/e2e/e2e-results.json

  # Task 6 (2026-10-10): the runtime IMAGE, not just the runtime dependency list. `pnpm ls --prod`
  # says what SHOULD be installed; only `docker build` says what the deployed container actually
  # contains. Nothing here is a size threshold — the number is printed so the next change can be
  # compared against it.
  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build apps/api/Dockerfile
        run: docker build -f apps/api/Dockerfile -t klass-api:${{ github.sha }} .
      - name: Image size (printed for comparison, not a gate)
        run: docker images klass-api --format '{{.Repository}}:{{.Tag}}  {{.Size}}'
      - name: No dev dependencies in the runtime layer
        # pnpm's strict layout resolves ONLY direct dependencies from apps/api, which is what makes
        # this a real test: a devDependency would be resolvable there, a transitive one is not.
        # pino therefore shows up only as fastify's own dependency — proved by starting fastify's
        # logger inside the container. The checks live in scripts/check-runtime-image.sh because an
        # inline `sh -c '…'` cannot contain the quotes that script needs (run 38049533552).
        run: docker run --rm -i --entrypoint sh klass-api:${{ github.sha }} < scripts/check-runtime-image.sh
      - name: Runs as a non-root user
        run: |
          set -e
          docker run --rm --entrypoint sh klass-api:${{ github.sha }} -c '
            set -e
            echo "user=$(id -un) uid=$(id -u)"
            test "$(id -u)" -ne 0
            test "$(id -un)" = node
          '
      - name: Without secrets it refuses to start and prints no values
        # Measured on run 38050670935: in a production image the FIRST failure is config
        # validation, not the database — `productionSecretProblems` refuses the dev defaults. The
        # container said `config invalid: JWT_SECRET, LIVEKIT_API_KEY — values are not printed`,
        # which is exactly the behaviour this step now pins: names yes, values no.
        run: |
          set +e
          out=$(timeout 180 docker run --rm --entrypoint node klass-api:${{ github.sha }} dist/server.js 2>&1)
          code=$?
          set -e
          echo "--- container output ---"; echo "$out"; echo "--- exit code: $code"
          test "$code" -ne 0
          echo "$out" | grep -q "config invalid:"
          echo "$out" | grep -q "JWT_SECRET"
          if echo "$out" | grep -qE "dev-only-secret|postgres(ql)?://|:klass@"; then
            echo "FAIL: a value reached the output"; exit 1
          fi
          echo "ok: refused to start, named the keys, printed no values"
      - name: Without DATABASE_URL it exits non-zero and echoes no connection string
        # Fictitious, deliberately-wrong-but-valid-shaped secrets, so config validation passes and
        # the failure that surfaces is the database connection.
        run: |
          set +e
          out=$(timeout 180 docker run --rm \
            -e JWT_SECRET=ci-fictitious-jwt-secret-0123456789abcdef \
            -e LIVEKIT_API_KEY=ci-fictitious-key \
            -e LIVEKIT_API_SECRET=ci-fictitious-secret-0123456789abcdef \
            --entrypoint node klass-api:${{ github.sha }} dist/server.js 2>&1)
          code=$?
          set -e
          echo "--- container output ---"; echo "$out"; echo "--- exit code: $code"
          test "$code" -ne 0
          echo "$out" | grep -q "boot failed:"
          if echo "$out" | grep -qE "postgres(ql)?://|@localhost|:klass@|ci-fictitious-jwt"; then
            echo "FAIL: a connection string or a secret value reached the output"; exit 1
          fi
          echo "ok: non-zero exit, boot failure named by class+code, no connection string"

  # Task 8 (2026-10-10): the image, RUNNING. `docker-image` proves what is inside the layer; this
  # job starts the container the way a deployment does — NODE_ENV=production, a real Postgres as a
  # service, TRUST_PROXY=1, PUBLIC_URL set, fictitious secrets — and behaves like an operator for
  # the first minutes: health, the migration journal, the built SPA, the CSRF gate, a pg-boss job
  # actually processed, and then Postgres stopped and started under the running app.
  # The build is --no-cache on purpose: it also answers "does the Dockerfile depend on cached
  # layers from an earlier build", and the elapsed time is printed.
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: klass
          POSTGRES_PASSWORD: klass
          POSTGRES_DB: klass
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U klass" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clean build of the image, without any layer cache
        run: |
          start=$(date +%s)
          docker build --no-cache -f apps/api/Dockerfile -t klass-api:smoke .
          echo "clean docker build took $(( $(date +%s) - start ))s"
      - name: Smoke the running container (health, migrations, SPA, CSRF, queue, DB restart)
        # the id is passed inline: `$GITHUB_ENV` only reaches LATER steps, and the first run of this
        # job failed on `docker exec  psql …` with an empty container id for exactly that reason.
        run: |
          SMOKE_PG=$(docker ps --filter ancestor=postgres:16-alpine --format '{{.ID}}' | head -1) \
            node scripts/runtime-smoke.mjs
