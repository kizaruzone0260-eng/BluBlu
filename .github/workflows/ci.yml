name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: klass
          POSTGRES_PASSWORD: klass
          POSTGRES_DB: klass
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U klass" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://klass:klass@localhost:5433/klass
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # packageManager pinned in root package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # web/api typecheck imports @klass/shared → its dist must exist first
      - run: pnpm --filter @klass/shared build
      - run: pnpm -r typecheck
      - run: pnpm -r build
      - run: pnpm --filter @klass/api test          # unit + integration (real Postgres 16)
      - run: pnpm audit --prod --audit-level=high
        continue-on-error: true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build-test
    services:
      # The media server the RTC specs need, so they stop self-skipping. Eight of the 81 tests
      # skipped on every CI run before this (zz-camera, zz2-moderation, zz4-layout, four of
      # zz13-screen-stage, zz16's compact button). The config goes in through LIVEKIT_CONFIG —
      # the documented alternative to `--config` — because a job service has no `args` key
      # (measured: run 37968027051 failed as a workflow-file problem on exactly that).
      # If the container ever fails to start, the specs skip again with the URL in the message
      # instead of turning the run red; the skip count is what the report tracks.
      livekit:
        image: livekit/livekit-server:v1.13.9
        ports: ['7880:7880', '7881:7881', '50000-50019:50000-50019/udp']
        env:
          # test-only key pair, matching apps/e2e/scripts/e2e-stack.mjs — not a secret
          LIVEKIT_CONFIG: |
            port: 7880
            rtc:
              tcp_port: 7881
              port_range_start: 50000
              port_range_end: 50019
              use_external_ip: false
            keys:
              e2ekey: e2esecrete2esecrete2esecrete2esecret
    env:
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_WS_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: e2ekey
      LIVEKIT_API_SECRET: e2esecrete2esecrete2esecrete2esecret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm --filter @klass/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @klass/e2e test
