name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: klass
          POSTGRES_PASSWORD: klass
          POSTGRES_DB: klass
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U klass" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://klass:klass@localhost:5433/klass
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # packageManager pinned in root package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # web/api typecheck imports @klass/shared → its dist must exist first
      - run: pnpm --filter @klass/shared build
      - run: pnpm -r typecheck
      - run: pnpm -r build
      - run: pnpm --filter @klass/api test          # unit + integration (real Postgres 16)
      - run: pnpm audit --prod --audit-level=high
        continue-on-error: true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build-test
    services:
      # The media server the RTC specs need, so they stop self-skipping (see .github/livekit-ci.yaml).
      # If this container ever fails to come up the specs skip again rather than turn the run red —
      # the skip count is reported in the task report, not hidden.
      livekit:
        image: livekit/livekit-server:v1.13.9
        ports: ['7880:7880', '7881:7881', '50000-50099:50000-50099/udp']
        volumes:
          - ${{ github.workspace }}/.github/livekit-ci.yaml:/etc/livekit.yaml:ro
        args: --config /etc/livekit.yaml
    env:
      # test-only values, matching apps/e2e/scripts/e2e-stack.mjs and livekit-ci.yaml
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_WS_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: e2ekey
      LIVEKIT_API_SECRET: e2esecrete2esecrete2esecrete2esecret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm --filter @klass/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @klass/e2e test
