name: ci

on:
  push:
  pull_request:
  # Ручной запуск без коммита: RTC-спеки зависят от таймингов, и чтобы сказать «прогон зелёный
  # не по везению», нужен способ запустить CI на том же хэше ещё раз. Пустые коммиты ради этого
  # не годятся (шум в истории), а `gh run rerun` — это перезапуск того же прогона, а не новый.
  workflow_dispatch:

# 2026-10-28, аудит SEC-07 (CWE-269). Прежний файл не имел блока `permissions` вообще, то есть
# каждый job получал тот scope, который настроен в настройках репозитория, — а это значение
# по умолчанию умеет быть «read-write», и ни один тест об этом не сказал бы. Теперь минимальный
# scope задан ЯВНО и здесь, и он одинаков для всех семи джоб: `contents: read` (клон + история),
# ничего больше. Загрузка артефактов — единственная операция, которой нужно расширение, и она
# получает `actions: write` локально, в трёх своих джобах, а не всему workflow.
#
# Второе, что здесь поправлено тем же заходом (CWE-1104): все сторонние действия закреплены по
# commit SHA вместо мутабельного тега `@v4`. Тег — это указатель, который владелец репозитория
# действия может двинуть в любую минуту, и следующий релиз тогда приедет в CI сам, без решения
# владельца BluBlu. Версии НЕ повышены: каждый SHA — это ровно тот коммит, на который теги
# `v4` указывали на момент правки (checkout v4.4.0, setup-node v4.4.0, pnpm/action-setup v4.3.0,
# upload-artifact v4.6.2), поэтому поведение джоб не меняется. Поднятие
# мажорной версии — отдельная задача со своей проверкой, а не побочный эффект пиннинга.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: klass
          POSTGRES_PASSWORD: klass
          POSTGRES_DB: klass
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U klass" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://klass:klass@localhost:5433/klass
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # полная история обязательна: этот job проверяет секреты по всем коммитам, а shallow-клон
        # (fetch-depth: 1 по умолчанию) дал бы «история прочитана — 0 находок» там, где
        # история не прочитана вовсе
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0   # packageManager pinned in root package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # web/api typecheck imports @klass/shared → its dist must exist first
      - run: pnpm --filter @klass/shared build
      - run: pnpm -r typecheck
      - run: pnpm -r build
      # C2 (2026-10-16): source maps в собранном фронтенде — безусловная проверка.
      # Прежняя поза жила внутри теста и молча пропускала случай «сборки нет в этом checkout»;
      # теперь сборка обязательна шаг за шагом, и её отсутствие — падение, а не зелёный цвет.
      - name: Ноль source map в apps/web/dist (безусловно)
        run: |
          set -euo pipefail
          if [ ! -d apps/web/dist ]; then
            echo "::error::apps/web/dist не собран — проверка source maps не состоялась"
            exit 2
          fi
          if [ -z "$(find apps/web/dist -name index.html -print -quit)" ]; then
            echo "::error::в apps/web/dist нет index.html — собралось не то, проверка не состоялась"
            exit 2
          fi
          maps=$(find apps/web/dist -name '*.map' -print)
          if [ -n "$maps" ]; then
            echo "::error::в сборке фронтенда есть source maps (исходники станут публичными):"
            printf '%s\n' "$maps"
            exit 1
          fi
          echo "source maps: 0; файлов в apps/web/dist: $(find apps/web/dist -type f | wc -l)"
      # C1 (2026-10-16): заголовки скачивания пользовательских файлов держит интеграционный
      # тест (`phase1-uploads.test.ts` проверяет CSP живого ответа Fastify), карта типов —
      # `test/unit/file-csp.test.ts` на чистой функции.
      - run: pnpm --filter @klass/api test          # unit + integration (real Postgres 16)
      # Секреты: сначала positive control детектора (8 форм обязаны ловиться), потом сам скан.
      # Скрипт выходит с кодом 2, если не смог прочитать дерево или историю — «чисто» и
      # «не посмотрел» больше не печатают одно и то же.
      - run: node scripts/security-scan.mjs --selftest
      - run: node scripts/security-scan.mjs
      # Второй глаз: независимый сканер по всей истории. Это инструмент CI, не зависимость
      # проекта (gitleaks 8.30.1, лицензия MIT). Версия пиннится, сумма сверяется.
      # Почему шаг не может быть просто `gitleaks …`: на этой истории инструмент, не сумев
      # прочитать часть диффов, печатает «no leaks found» и выходит с 0 (замерено: 3 строки ERR,
      # 151 коммит из 162, exit 0). Значит «проверка не состоялась» отделяется от «чисто» здесь:
      # по наличию ERR в выводе — exit 2. Находка секрета — exit 1. Значения redact-ятся.
      - name: gitleaks — независимый скан истории
        env:
          GL_VERSION: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}"
          asset="gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          curl -sSfLo "$asset" "$base/$asset"
          curl -sSfLo checksums.txt "$base/gitleaks_${GL_VERSION}_checksums.txt"
          grep " ${asset}\$" checksums.txt > only.sha256
          sha256sum -c only.sha256
          tar -xzf "$asset" gitleaks
          ./gitleaks version
          rc=0; out=$(./gitleaks git --redact --no-banner --log-opts=--all -c .gitleaks.toml . 2>&1) || rc=$?
          # gitleaks красит уровни ANSI-последовательностями: без их снятия поиск «ERR» не
          # срабатывает никогда (проверено локально: крашеная строка с ERR есть, grep молчит).
          plain=$(printf '%s\n' "$out" | sed -E 's/\x1b\[[0-9;]*m//g')
          printf '%s\n' "$plain"
          if printf '%s\n' "$plain" | grep -qE '(^| )ERR( |$)'; then
            echo "::error::gitleaks не прочитал часть истории — «чисто» в этом случае ничего не значит"
            exit 2
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::gitleaks: находки (выведены redact-ными, значения не печатаются)"
            exit 1
          fi
          scanned=$(printf '%s\n' "$plain" | grep -oE '[0-9]+ commits scanned' | grep -oE '^[0-9]+' || echo '?')
          echo "gitleaks: находок нет; прочитано ${scanned} коммитов, достижимо из refs — $(git rev-list --all --count)"
      # C4 (2026-10-16): блокирующий аудит production-зависимостей. Прежний шаг
      # `pnpm audit --prod --audit-level=high` печатал high-находку и выходил с нулём (замер
      # прогона 38844444987: таблица есть, job зелёный) — то есть не проверял ничего. Скрипт
      # решает исход: high/critical блокируют, кроме явно перечисленных с причиной и сроком
      # пересмотра; непрочитанный аудит = exit 2, чтобы «не посмотрели» ≠ «чисто».
      - name: pnpm audit --prod (blocking high/critical, список известных с expiry)
        run: node scripts/audit-gate.mjs
        # `continue-on-error: true` здесь не ставится. Он стоял с 2026-10-16 и ровно обнулял то,
        # для чего шаг был написан: high-находка красила строку лога и оставляла джобу зелёной.
        # Снимается теперь, когда находки правда закрыты (zod 4.6.7, dompurify 3.4.17,
        # fast-uri 3.1.9/4.2.3, fastify 5.12.7), а не тогда, когда их стало неудобно терпеть.
        # Следующая high/critical, не внесённая в KNOWN осмысленно, должна валить CI — это и есть
        # единственная проверка того, что «зелёный» значит «чисто».

  e2e:
    runs-on: ubuntu-latest
    # `actions: write` нужен ровно одному шагу этого джобы — actions/upload-artifact с трассами
    # и test-results. Без него при верхнем `permissions: contents: read` выкладка падала бы с
    # «Resource not accessible by integration», и это был бы красный CI без дефекта в коде.
    permissions:
      contents: read
      actions: write
    # 25 минут стало мало после zz20–zz22: прогон 38506706395 был снят таймаутом ровно на 25m21s
    # (все остальные джобы — зелёные). Набор растёт вместе с фичами, а «упало 4 теста из-за
    # таймера» — это не про код. Заодно tracet-snapshot шаг остаётся доступным.
    # 40 → 50 (2026-10-17): прогон 38997323161 дошёл только до 75 теста из 118 — восемь кликов
    # без actionTimeout ждали по 2,5–7 минут, и джоба умерла по таймеру, не успев напечатать
    # отчёт. Теперь таймаут действия ограничен в самом Playwright, а запас по джобе — здесь.
    timeout-minutes: 50
    needs: build-test
    services:
      # The media server the RTC specs need, so they stop self-skipping. Eight of the 81 tests
      # skipped on every CI run before this (zz-camera, zz2-moderation, zz4-layout, four of
      # zz13-screen-stage, zz16's compact button). The config goes in through LIVEKIT_CONFIG —
      # the documented alternative to `--config` — because a job service has no `args` key
      # (measured: run 37968027051 failed as a workflow-file problem on exactly that).
      # If the container ever fails to start, the specs skip again with the URL in the message
      # instead of turning the run red; the skip count is what the report tracks.
      livekit:
        image: livekit/livekit-server:v1.13.9
        ports: ['7880:7880', '7881:7881', '50000-50019:50000-50019/udp']
        env:
          # test-only key pair, matching apps/e2e/scripts/e2e-stack.mjs — not a secret
          LIVEKIT_CONFIG: |
            port: 7880
            rtc:
              tcp_port: 7881
              port_range_start: 50000
              port_range_end: 50019
              use_external_ip: false
            keys:
              e2ekey: e2esecrete2esecrete2esecrete2esecret
    env:
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_WS_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: e2ekey
      LIVEKIT_API_SECRET: e2esecrete2esecrete2esecrete2esecret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm --filter @klass/e2e exec playwright install --with-deps chromium
      # Спек с тегом @unstable в этом джобе не запускается: он уехал в `e2e-unstable` ниже,
      # где падение не блокирует деплой. Причина и ручная проверка — в docs/MANUAL_QA.md.
      # @shots — второй исключённый тег: съёмка скриншотов (`phone-shots` ниже) ничего не
      # утверждает, но стоит минут десять и десятки мегабайт PNG, поэтому в блокирующем наборе
      # ей не место.
      - run: pnpm --filter @klass/e2e exec playwright test --grep-invert "@unstable|@shots"
      # RTC-спеки умеют пропускать себя сами, когда медиа-сервер недоступен. Без этого гейта job с
      # мёртвым LiveKit-контейнером был бы зелёным — поэтому пропущенный тест = упавший CI.
      - run: node scripts/ci-no-skips.mjs apps/e2e/e2e-results.json
      # RTC-тесты падают от таймингов распространения прав в комнате — по одной строке
      # «Expected true / Received false» причину не восстановить. Трассы и скриншоты падения
      # уезжают артефактом (retain-on-failure в playwright.config.ts), хранятся 7 дней.
      # `always()`, а не `failure()`: прогон 38997323161 сняли по таймеру джобы, шаг с `failure()`
      # при отмене не запустился, и красные спеки остались без единственных доказательств — их
      # разбирали бы по логам LiveKit. Артефакт зелёного прогона почти пустой (в нём только
      # e2e-results.json), это плата за сохранённые трассы.
      - name: Трассы и test-results упавшего прогона
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-test-results-${{ github.run_id }}
          path: |
            apps/e2e/test-results
            apps/e2e/e2e-results.json
          retention-days: 7
          if-no-files-found: warn

  # Спек не удалён и не ослаблен: он просто перестал определять хэш деплоя. Сюда попадают только
  # браузерные проверки, у которых причина падения не установлена после попытки исправления или
  # которые зависят от таймингов, не воспроизводимых на CI-машине. Каждый такой спек обязан быть
  # вписан в docs/MANUAL_QA.md с шагами ручной проверки.
  e2e-unstable:
    runs-on: ubuntu-latest
    # то же, что в `e2e`: `actions: write` только ради выкладки трасс упавшего прогона
    permissions:
      contents: read
      actions: write
    timeout-minutes: 20
    needs: build-test
    continue-on-error: true
    services:
      # Медиа-сервер здесь нужен: под тегом @unstable живут не только «долгие», но и RTC-спеки
      # (zz19, порядок кадров с задержкой 8 с). Без LiveKit они умеют пропускать себя сами, и
      # неблокирующий джоб молча стал бы «зелёным absent'ом» — проверка исчезла бы из CI совсем.
      # Тот же test-only ключ, что в джобе e2e, и та же LIVEKIT_CONFIG вместо --config (у
      # service-контейнера нет ключа args; замерено на прогоне 37968027051).
      livekit:
        image: livekit/livekit-server:v1.13.9
        ports: ['7880:7880', '7881:7881', '50000-50019:50000-50019/udp']
        env:
          LIVEKIT_CONFIG: |
            port: 7880
            rtc:
              tcp_port: 7881
              port_range_start: 50000
              port_range_end: 50019
              use_external_ip: false
            keys:
              e2ekey: e2esecrete2esecrete2esecrete2esecret
    env:
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_WS_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: e2ekey
      LIVEKIT_API_SECRET: e2esecrete2esecrete2esecrete2esecret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm --filter @klass/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @klass/e2e exec playwright test --grep @unstable
      - name: Трассы и test-results неблокирующего спека
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-unstable-results-${{ github.run_id }}
          path: |
            apps/e2e/test-results
            apps/e2e/e2e-results.json
          retention-days: 7
          if-no-files-found: warn

  # Часть G (2026-10-16): съёмка основных экранов в профиле Pixel 7 (393×851, тач) — три языка и
  # обе темы. Джоб НЕ блокирует деплой: он ничего не утверждает, кроме «экран отрисовался в этом
  # языке и теме» (m-phone-screens ниже по списку спрашивает геометрией всё остальное). Смысл —
  # артефакт, который человек открывает глазами: «две строки подписи сдвинули таблицу», «тёмная
  # тема забыла фон карточки» линейкой не измеряются.
  # Медиа-сервер не нужен: урок снимается как экран, вход в комнату спеком не делается.
  phone-shots:
    runs-on: ubuntu-latest
    # то же, что в `e2e`: `actions: write` только ради выкладки кадров телефонов
    permissions:
      contents: read
      actions: write
    timeout-minutes: 25
    needs: build-test
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # мобильный проект — это chromium (устройства Playwright), Edge/`channel` тут не вариант
      - run: pnpm --filter @klass/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @klass/e2e exec playwright test --project=pixel7 --grep @shots
      - name: Кадры телефонов
        # always(): сорванный на пятом экране прогон всё равно обязан отдать снятые кадры —
        # именно они и показывают, на котором из экранов что-то сломалось
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phone-shots-${{ github.run_id }}
          path: apps/e2e/test-results/phone-shots
          retention-days: 14
          if-no-files-found: error

  # Task 6 (2026-10-10): the runtime IMAGE, not just the runtime dependency list. `pnpm ls --prod`
  # says what SHOULD be installed; only `docker build` says what the deployed container actually
  # contains. Nothing here is a size threshold — the number is printed so the next change can be
  # compared against it.
  # Часть D2 (2026-10-16): цикл восстановления на НАСТОЯЩИХ скриптах. Ни один прежний тест не
  # звал deploy/scripts/backup.sh и restore.sh — проверялся только логический путь через драйвер,
  # а «бэкап, из которого нельзя восстановиться», зелёным тестом не ловится. Вот он: Postgres
  # как сервис, журнал миграций применяется psql'ом, затем backup.sh (отказ без пароля / открытый
  # режим / шифрование), restore.sh в пустую базу, сверка счётчиков, позы RLS и байтов файла.
  # Ни node, ни pnpm этому job'у не нужны — он про shell, psql и openssl.
  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: klass
          POSTGRES_PASSWORD: klass
          POSTGRES_DB: klass
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U klass" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5433'
      PGUSER: klass
      PGPASSWORD: klass
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: backup.sh → шифрование → restore.sh → сверка (прямой режим, pg_dump)
        run: bash deploy/scripts/test-backup-restore.sh
      - name: pg_dump и версии клиента (чтобы вывод сверки читался без догадок)
        if: always()
        run: |
          pg_dump --version
          psql --version
          openssl version

  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build apps/api/Dockerfile
        run: docker build -f apps/api/Dockerfile -t klass-api:${{ github.sha }} .
      - name: Image size (printed for comparison, not a gate)
        run: docker images klass-api --format '{{.Repository}}:{{.Tag}}  {{.Size}}'
      - name: No dev dependencies in the runtime layer
        # pnpm's strict layout resolves ONLY direct dependencies from apps/api, which is what makes
        # this a real test: a devDependency would be resolvable there, a transitive one is not.
        # pino therefore shows up only as fastify's own dependency — proved by starting fastify's
        # logger inside the container. The checks live in scripts/check-runtime-image.sh because an
        # inline `sh -c '…'` cannot contain the quotes that script needs (run 38049533552).
        run: docker run --rm -i --entrypoint sh klass-api:${{ github.sha }} < scripts/check-runtime-image.sh
      - name: Runs as a non-root user
        run: |
          set -e
          docker run --rm --entrypoint sh klass-api:${{ github.sha }} -c '
            set -e
            echo "user=$(id -un) uid=$(id -u)"
            test "$(id -u)" -ne 0
            test "$(id -un)" = node
          '
      - name: Without secrets it refuses to start and prints no values
        # Measured on run 38050670935: in a production image the FIRST failure is config
        # validation, not the database — `productionSecretProblems` refuses the dev defaults. The
        # container said `config invalid: JWT_SECRET, LIVEKIT_API_KEY — values are not printed`,
        # which is exactly the behaviour this step now pins: names yes, values no.
        run: |
          set +e
          out=$(timeout 180 docker run --rm --entrypoint node klass-api:${{ github.sha }} dist/server.js 2>&1)
          code=$?
          set -e
          echo "--- container output ---"; echo "$out"; echo "--- exit code: $code"
          test "$code" -ne 0
          echo "$out" | grep -q "config invalid:"
          echo "$out" | grep -q "JWT_SECRET"
          if echo "$out" | grep -qE "dev-only-secret|postgres(ql)?://|:klass@"; then
            echo "FAIL: a value reached the output"; exit 1
          fi
          echo "ok: refused to start, named the keys, printed no values"
      - name: Without DATABASE_URL it exits non-zero and echoes no connection string
        # Fictitious, deliberately-wrong-but-valid-shaped secrets, so config validation passes and
        # the failure that surfaces is the database connection.
        run: |
          set +e
          out=$(timeout 180 docker run --rm \
            -e JWT_SECRET=fictitious-jwt-secret-0123456789abcdef \
            -e LIVEKIT_API_KEY=fictitious-key \
            -e LIVEKIT_API_SECRET=fictitious-secret-0123456789abcdef \
            --entrypoint node klass-api:${{ github.sha }} dist/server.js 2>&1)
          code=$?
          set -e
          echo "--- container output ---"; echo "$out"; echo "--- exit code: $code"
          test "$code" -ne 0
          echo "$out" | grep -q "boot failed:"
          if echo "$out" | grep -qE "postgres(ql)?://|@localhost|:klass@|fictitious-jwt"; then
            echo "FAIL: a connection string or a secret value reached the output"; exit 1
          fi
          echo "ok: non-zero exit, boot failure named by class+code, no connection string"

  # Task 8 (2026-10-10): the image, RUNNING. `docker-image` proves what is inside the layer; this
  # job starts the container the way a deployment does — NODE_ENV=production, a real Postgres as a
  # service, TRUST_PROXY=1, PUBLIC_URL set, fictitious secrets — and behaves like an operator for
  # the first minutes: health, the migration journal, the built SPA, the CSRF gate, a pg-boss job
  # actually processed, and then Postgres stopped and started under the running app.
  # The build is --no-cache on purpose: it also answers "does the Dockerfile depend on cached
  # layers from an earlier build", and the elapsed time is printed.
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: klass
          POSTGRES_PASSWORD: klass
          POSTGRES_DB: klass
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U klass" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Clean build of the image, without any layer cache
        run: |
          start=$(date +%s)
          docker build --no-cache -f apps/api/Dockerfile -t klass-api:smoke .
          echo "clean docker build took $(( $(date +%s) - start ))s"
      - name: Smoke the running container (health, migrations, SPA, CSRF, queue, DB restart)
        # the id is passed inline: `$GITHUB_ENV` only reaches LATER steps, and the first run of this
        # job failed on `docker exec  psql …` with an empty container id for exactly that reason.
        run: |
          SMOKE_PG=$(docker ps --filter ancestor=postgres:16-alpine --format '{{.ID}}' | head -1) \
            node scripts/runtime-smoke.mjs
