# Конфиг независимого сканера секретов (gitleaks 8.30.1, лицензия MIT). Используется только
# шагом CI и ручной проверкой; это не зависимость проекта.
#
# Разрешено здесь ровно одно: значения, которые САМИ подписаны как вымышленные. Фильтр идёт по
# ФОРМЕ значения, а не по файлу, — путь целиком был бы ослаблением: секрет, случайно попавший
# в ci.yml или в этот тест, должен быть найден.
#
# C3 (2026-10-16): общего правила `^ci-` больше нет. Оно пропускало ЛЮБОЕ значение, начинающееся
# с «ci-», то есть и настоящую переменную вида `ci-deploy-token-…`, и ключ, который кто-то
# скопировал из CI-панели с таким префиксом. Фикстуры в текущем дереве переименованы в явные
# `fictitious-…`, а значения, которые остались в истории (историю не переписывали),
# перечислены дословно — не префиксом, а полными строками:
#
#   ^fictitious-…                                фикстуры сегодняшнего дерева (CI, тесты)
#   ^ci-fictitious-jwt-secret-0123456789abcdef   ci.yml:136 в коммите f9fdd4a (2026-10-10)
#   ^ci-fictitious-secret-0123456789abcdef       ci.yml:138 того же коммита
#   ^guestkey-0123456789abcdef                   guest-links.test.ts:38 в коммите 0ef001a (2026-10-29)
#   ^guestkey-fedcba9876543210                   guest-links.test.ts:39 того же коммита
#
# 2026-10-29: последние две строки — фикстуры гостевых ссылок. Это не секреты: ключ гостя
# браузер генерирует сам и хранит в localStorage вкладки; значение фиксировано, чтобы тест
# отличал «мою» заявку от чужой (случайность проверяется в юните). В дереве они уже называются
# `fictitious-guestkey-…`, но в истории коммита 0ef001a остались старые строки, а историю мы не
# переписываем — поэтому они здесь дословно.
#
# Прошлый замер (2026-10-16, история в 221 коммит): с правилом `^ci-` — 0 находок, без него —
# ровно те две строки из ci.yml в коммите f9fdd4a. Поэтому они перечислены дословно.
#
# Замер 2026-10-29: полный прогон `gitleaks git --log-opts=--all` с этим конфигом — 0 находок
# (значения не печатались). Если убрать четыре дословных правила, тот же прогон даёт ровно эти
# четыре строки: две из ci.yml (f9fdd4a) и две из guest-links.test.ts (0ef001a). Расширять
# список по сегодняшнему дереву нечем.
#
# Собственный сканер (`scripts/security-scan.mjs`) те же строки пропускает по allow-списку
# путей; списки сходятся по составу находок, а не по молчанию.

title = "BluBlu — gitleaks allowlist для CI"

[extend]
useDefault = true

[allowlist]
description = "вымышленные значения, подписанные как вымышленные"
regexes = [
  '''^fictitious-[a-z0-9\-]+$''',
  '''^ci-fictitious-jwt-secret-0123456789abcdef$''',
  '''^ci-fictitious-secret-0123456789abcdef$''',
  '''^guestkey-0123456789abcdef$''',
  '''^guestkey-fedcba9876543210$''',
]
