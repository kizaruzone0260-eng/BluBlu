# Конфиг независимого сканера секретов (gitleaks 8.30.1, лицензия MIT). Используется только
# шагом CI и ручной проверкой; это не зависимость проекта.
#
# Разрешено здесь ровно одно: значения-заглушки, которые сами подписаны как заглушки.
# Фильтр идёт по ФОРМЕ значения, а не по файлу, — путь целиком был бы ослаблением:
# секрет, случайно попавший в ci.yml или в этот тест, должен быть найден.
#
#   ^ci-          тестовые значения, которые CI подставляет в локальный Postgres/LiveKit
#                 (JWT_SECRET, LIVEKIT_API_KEY, LIVEKIT_API_SECRET в .github/workflows/ci.yml);
#                 боевые секреты в репозиторий не коммитятся вообще — они в панели Render
#   ^fictitious-  вымышленный TELEGRAM_WEBHOOK_SECRET из теста приёма вебхука
#
# Собственный сканер (`scripts/security-scan.mjs`) те же строки пропускает по allow-списку
# путей; списки сходятся по составу находок, а не по молчанию: без этого фильтра gitleaks
# даёт 3 находки, и все три — эти заглушки (проверено 2026-10-11, значения не печатались).

title = "BluBlu — gitleaks allowlist для CI"

[extend]
useDefault = true

[allowlist]
description = "заглушки, подписанные как заглушки"
regexes = [
  '''^ci-[A-Za-z0-9_\-]{8,}$''',
  '''^fictitious-[a-z0-9\-]+$''',
]
