<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- build stamp: the API replaces 'dev' with RENDER_GIT_COMMIT when serving the shell -->
    <meta name="app-build" content="dev" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="description" content="BluBlu — платформа онлайн-уроков" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Performance (Phase 4): preload the two Inter weights used above the fold
         so the first text paint (LCP) does not wait on the CSS @font-face scan.
         crossorigin is required for font preloads to match the fetch. -->
    <link rel="preload" href="/fonts/inter-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-600-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>BluBlu</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
