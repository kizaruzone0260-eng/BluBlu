# Throwaway Postgres for local integration tests (needs Docker):
#   docker compose -f deploy/docker-compose.test.yml up -d
#   DATABASE_URL_TEST=postgres://klass:klass@localhost:5433/klass pnpm --filter @klass/api test
services:
  postgres-test:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: klass
      POSTGRES_PASSWORD: klass
      POSTGRES_DB: klass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klass"]
      interval: 5s
      timeout: 3s
      retries: 10
