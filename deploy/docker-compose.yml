name: klass

# Budget for 12 GB ARM VM (Oracle Free): livekit ≤4G, postgres ≤2G, api ≤1G, caddy ≤0.5G.
# All images below are multi-arch (linux/arm64 supported) — verified tags.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: klass
      POSTGRES_DB: klass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klass -d klass"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2G
    ulimits:
      nofile: { soft: 65536, hard: 65536 }

  livekit:
    image: livekit/livekit-server:v1.8.2
    restart: unless-stopped
    command: --config /etc/livekit/livekit.yaml
    environment:
      # LiveKit env-override convention: LIVEKIT_<YAML PATH> (dots→underscores)
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      LIVEKIT_RTC_TURN_DOMAIN: ${DOMAIN}
      LIVEKIT_RTC_TURN_CERT_FILE: /etc/turn-certs/livekit.pem
      LIVEKIT_RTC_TURN_KEY_FILE: /etc/turn-certs/livekit-key.pem
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml:ro
      - ./turn-certs:/etc/turn-certs:ro   # place certbot PEMs here (see docs/STAGE0_SPIKE.md)
    ports:
      - "7882:7882/udp"   # single RTC UDP port (mux)
      - "7881:7881"       # RTC TCP fallback
      - "3478:3478/udp"   # TURN
      - "5349:5349"       # TURN-TLS
    healthcheck:
      test: ["CMD", "/livekit-server", "--health-check"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      STORAGE_DIR: /data/files
    volumes:
      - files:/data/files
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          memory: 1G

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:
