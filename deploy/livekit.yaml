# LiveKit Server — single node, no Redis, built-in TURN.
# NOTE: keys below follow LiveKit v1.8 documented config; final validation is the
# stage-0 spike on the real server (two networks) — see docs/STAGE0_SPIKE.md.
keys:
  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}

room:
  empty_timeout: 300        # seconds after last participant before room closes
  max_participants: 25      # v1 limit; stage-4 load test may adjust

rtc:
  tcp_port: 7881
  udp_port: 7882            # single UDP port (mux) — no large range needed
  port_range: 50000-50100   # ignored when udp_port set; kept small for safety
  turn:
    domain: ${DOMAIN}       # enables TURN/TLS (certs reused from LiveKit autocert)
    static_user: true       # static credentials derived from API key pair

logging:
  level: info
  pionlevel: warning
