# LiveKit Server — single node, no Redis, built-in TURN.
# Keys verified against livekit config-sample.yaml (master, 2026-10-03):
#   rtc.udp_port = single UDP mux port; rtc.turn.{enabled,udp_port,tls_port,domain,cert_file,key_file}
#   TURN credentials for participants are generated automatically (HMAC from API key).
#   There is NO static_user option. Env overrides use LIVEKIT_<YAML_PATH> convention
#   (e.g. LIVEKIT_RTC_TURN_DOMAIN), keys via LIVEKIT_KEYS="key: secret".
port: 7880
bind_addresses:
  - 0.0.0.0

# keys are provided by compose via LIVEKIT_KEYS env (do not commit secrets)

rtc:
  tcp_port: 7881            # RTC over TCP fallback
  udp_port: 7882            # SINGLE UDP port (mux) — open 7882/udp only
  port_range_start: 50000   # unused while udp_port is set; kept for clarity
  port_range_end: 50000
  turn:
    enabled: true
    udp_port: 3478          # turn: (no TLS) — always available
    tls_port: 5349          # turns: (TLS) — requires cert_file/key_file below
    # domain / cert_file / key_file are set via env in docker-compose:
    #   LIVEKIT_RTC_TURN_DOMAIN, LIVEKIT_RTC_TURN_CERT_FILE, LIVEKIT_RTC_TURN_KEY_FILE
    # If certs are absent, LiveKit advertises only the non-TLS listener.

room:
  auto_create: false        # rooms are created by our API only (stage 4)
  empty_timeout: 300        # close 5 min after everyone leaves
  max_participants: 25      # v1 limit; stage-4 load test may adjust

logging:
  level: info
  pionlevel: warning
